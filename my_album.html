<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galeri Dokumentasi</title>
<style>
  :root {
    --bg: #f1f5f9; --card: #ffffff; --ink: #0f172a; --muted: #64748b; --line: #e2e8f0;
    --accent: #4f46e5; --accent-ink: #ffffff; --soft: #eef2ff; --danger: #b91c1c;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); background-attachment: fixed;
    color: var(--ink); min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; line-height: 1.5;
  }
  a { color: var(--accent); }
  :focus-visible { outline: 3px solid #a5b4fc; outline-offset: 2px; }

  .topbar { background: #f8fafc; border-bottom: 1px solid var(--line); box-shadow: 0 1px 3px rgba(15,23,42,.06); padding: 16px 0; margin-bottom: 20px; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px; }
  .topbar .wrap { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; }
  h1 { margin: 0; font-size: 1.4rem; }
  .sub { color: var(--muted); font-size: .85rem; }
  .search { display: flex; min-width: 260px; flex: 0 1 380px; }
  .search input { flex: 1; min-width: 0; padding: 9px 12px; border: 1px solid #cbd5e1; border-right: 0; border-radius: 8px 0 0 8px; font: inherit; background: #fff; }
  .search button { padding: 0 14px; border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 0 8px 8px 0; cursor: pointer; font: inherit; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .pill { border: 1px solid #cbd5e1; background: #fff; color: var(--ink); padding: 6px 14px; border-radius: 999px; font: inherit; font-size: .85rem; cursor: pointer; }
  .pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .pill .n { opacity: .75; margin-left: 4px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
  .card { background: var(--card); border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(15,23,42,.08); display: flex; flex-direction: column; transition: transform .15s, box-shadow .15s; }
  .card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(15,23,42,.14); }
  .cover { position: relative; display: block; width: 100%; aspect-ratio: 4 / 3; background: #e2e8f0; overflow: hidden; border: 0; padding: 0; cursor: pointer; text-align: left; }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #94a3b8; gap: 6px; font-size: 12px; }
  .empty svg { width: 34px; height: 34px; }
  .badge { position: absolute; top: 10px; left: 10px; z-index: 1; background: rgba(79,70,229,.92); color: #fff; font-size: 12px; padding: 2px 10px; border-radius: 999px; display: inline-flex; align-items: center; gap: 5px; }
  .badge svg { width: 12px; height: 12px; }
  .count { position: absolute; bottom: 10px; right: 10px; background: rgba(15,23,42,.72); color: #fff; font-size: 12px; padding: 2px 10px; border-radius: 999px; display: inline-flex; align-items: center; gap: 5px; }
  .count svg { width: 12px; height: 12px; }
  .play { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
  .play span { width: 52px; height: 52px; border-radius: 50%; background: rgba(15,23,42,.62); display: grid; place-items: center; }
  .play svg { width: 22px; height: 22px; fill: #fff; margin-left: 3px; }
  .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px; }
  .title { font-weight: 700; color: var(--ink); line-height: 1.3; background: none; border: 0; padding: 0; text-align: left; font: inherit; font-weight: 700; cursor: pointer; }
  .title:hover { color: var(--accent); }
  .meta { font-size: 12px; color: var(--muted); }

  .pager { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 24px 0 8px; }
  .pager button { min-width: 36px; padding: 6px 10px; border: 1px solid #cbd5e1; background: #fff; border-radius: 8px; cursor: pointer; font: inherit; }
  .pager button[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pager button:disabled { opacity: .45; cursor: default; }

  .state { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 28px 20px; text-align: center; color: var(--muted); }
  .state.error { color: var(--danger); border-color: #fecaca; background: #fef2f2; text-align: left; }
  .state.error ul { margin: 8px 0 0; padding-left: 20px; color: #7f1d1d; }
  .skeleton { height: 250px; border-radius: 12px; background: linear-gradient(90deg, #e2e8f0, #f1f5f9, #e2e8f0); background-size: 200% 100%; animation: sh 1.4s linear infinite; }
  @keyframes sh { to { background-position: -200% 0; } }

  /* Modal */
  .modal { position: fixed; inset: 0; z-index: 50; background: rgba(15,23,42,.72); display: none; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 24px 12px; }
  .modal.open { display: flex; }
  .sheet { background: #fff; border-radius: 14px; width: 100%; max-width: 980px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  .sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .sheet-head h2 { margin: 0; font-size: 1.2rem; line-height: 1.3; }
  .close { border: 0; background: #f1f5f9; border-radius: 8px; width: 36px; height: 36px; font-size: 20px; cursor: pointer; flex: none; }
  .stage { background: #0f172a; display: grid; place-items: center; min-height: 240px; }
  .stage img { max-width: 100%; max-height: 72vh; display: block; }
  .stage .frame { position: relative; width: 100%; aspect-ratio: 16 / 9; }
  .stage iframe, .stage video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
  .stage .frame.tall { aspect-ratio: auto; height: 70vh; background: #fff; }
  .stage .none { color: #cbd5e1; padding: 40px 20px; text-align: center; }
  .sheet-body { padding: 16px 20px 22px; }
  .desc { margin: 0 0 12px; white-space: pre-line; }
  .btn { display: inline-block; background: var(--accent); color: #fff; text-decoration: none; padding: 8px 16px; border-radius: 8px; font-size: .9rem; }
  .dh { font-size: 1.1rem; margin: 28px 0 10px; }
  .drivebox { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(15,23,42,.08); overflow: hidden; margin-bottom: 32px; }
  .drivebox iframe { display: block; width: 100%; height: 80vh; min-height: 480px; border: 0; }
  [hidden] { display: none !important; }
  .btn.alt { background: var(--soft); color: var(--accent); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 18px; }
  .sheet-body h3 { margin: 18px 0 8px; font-size: 1rem; }
  .cmt { border-top: 1px solid var(--line); padding: 10px 0; }
  .cmt b { font-size: .9rem; }
  .cmt time { color: var(--muted); font-size: .78rem; margin-left: 8px; }
  .cmt p { margin: 2px 0 0; white-space: pre-line; overflow-wrap: anywhere; }
  .none-cmt { color: var(--muted); font-size: .9rem; }

  @media (max-width: 767.98px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } .search { flex: 1 1 100%; } }
  @media (max-width: 400px) { .grid { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { .card, .skeleton { transition: none; animation: none; } .card:hover { transform: none; } }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <div>
      <h1>Galeri Dokumentasi</h1>
      <div class="sub">Dokumentasi foto dan video kegiatan</div>
    </div>
    <a class="btn alt" id="driveLink" target="_blank" rel="noopener noreferrer" href="#" hidden>Buka folder Drive</a>
    <form class="search" id="searchForm" role="search">
      <input id="q" type="search" placeholder="Cari judul atau deskripsi..." aria-label="Cari dokumentasi" autocomplete="off">
      <button type="submit" aria-label="Cari">Cari</button>
    </form>
  </div>
</header>

<main class="wrap">
  <div class="filters" id="filters" role="group" aria-label="Filter jenis"></div>
  <div id="content"><div class="grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></div>
  <nav class="pager" id="pager" aria-label="Halaman"></nav>
  <section id="driveSection" hidden aria-label="Foto dan video di Google Drive">
    <h2 class="dh">Foto &amp; video</h2>
    <div class="drivebox"><iframe id="driveFrame" title="Foto dan video di Google Drive" loading="lazy"></iframe></div>
  </section>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="sheet">
    <div class="sheet-head">
      <div><h2 id="mTitle"></h2><div class="meta" id="mMeta"></div></div>
      <button class="close" id="mClose" aria-label="Tutup">&times;</button>
    </div>
    <div class="stage" id="mStage"></div>
    <div class="sheet-body" id="mBody"></div>
  </div>
</div>

<script>
// ================= PENGATURAN =================
var SHEET_ID  = '1Oj-I5anukwE9XgzTwaHWWY1hfuqr9UHjv9khNa3tSKs';
var TAB_DOK   = 'dokumentasi';
var TAB_KOM   = 'komentar';
var PER_PAGE  = 12;
// OPSIONAL tapi paling andal: link CSV dari File > Share > Publish to web (per tab).
// Jika diisi, dipakai lebih dulu. Contoh: https://docs.google.com/spreadsheets/d/e/2PACX-.../pub?gid=0&single=true&output=csv
var PUB_DOK = '';
var PUB_KOM = '';
// Folder Google Drive tempat foto diunggah (harus: Anyone with the link - Viewer)
var DRIVE_FOLDER_ID = '1zMDlmYUpZYUVA6imRiNcFACrIaLUpAW0';
// OPSIONAL: isi API key Google Drive agar semua foto di folder tampil otomatis
// tanpa perlu menulis baris di spreadsheet. Kosongkan jika tidak dipakai.
var DRIVE_API_KEY = '';
// ===============================================

var state = { items: [], comments: {}, filter: 'semua', q: '', page: 1, current: null };
var $ = function (id) { return document.getElementById(id); };

var ICON = {
  image:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>',
  folder:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  video:   '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  comment: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'
};

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// ---------- CSV ----------
function parseCSV(text) {
  var rows = [], row = [], cell = '', inQ = false, i, c;
  text = text.replace(/^\uFEFF/, '');
  for (i = 0; i < text.length; i++) {
    c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else { inQ = false; } }
      else { cell += c; }
    } else if (c === '"') { inQ = true; }
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); cell = ''; rows.push(row); row = [];
    } else { cell += c; }
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
function toObjects(rows) {
  if (!rows.length) return [];
  var head = rows[0].map(function (h) { return h.trim().toLowerCase(); });
  return rows.slice(1).map(function (r) {
    var o = {};
    head.forEach(function (h, i) { o[h] = (r[i] || '').trim(); });
    return o;
  });
}
function loadTab(tab, pub) {
  var url = pub || ('https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&sheet=' + encodeURIComponent(tab));
  return fetch(url).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  }).then(function (t) {
    if (/^\s*<(!doctype|html)/i.test(t)) throw new Error('Sheet tidak dapat diakses publik');
    return toObjects(parseCSV(t));
  });
}

// ---------- Folder Drive ----------
function loadDriveFiles() {
  if (!DRIVE_FOLDER_ID || !DRIVE_API_KEY) return Promise.resolve([]);
  var url = 'https://www.googleapis.com/drive/v3/files?q=' + encodeURIComponent("'" + DRIVE_FOLDER_ID + "' in parents and trashed=false") +
    '&fields=' + encodeURIComponent('files(id,name,mimeType,createdTime)') + '&orderBy=createdTime%20desc&pageSize=1000&key=' + encodeURIComponent(DRIVE_API_KEY);
  return fetch(url).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (j) {
      return (j.files || []).map(function (f) {
        var isFolder = f.mimeType === 'application/vnd.google-apps.folder';
        var isVideo = /^video\//.test(f.mimeType);
        if (!isFolder && !isVideo && !/^image\//.test(f.mimeType)) return null;
        return {
          id: 'drive-' + f.id, name: f.name.replace(/\.[A-Za-z0-9]{2,5}$/, ''),
          tipe: isFolder ? 'folder' : isVideo ? 'video' : 'foto',
          url: isFolder ? 'https://drive.google.com/drive/folders/' + f.id : 'https://drive.google.com/file/d/' + f.id + '/view',
          created_at: f.createdTime, deskripsi: '', cover_url: ''
        };
      }).filter(Boolean);
    }).catch(function () { return []; });
}

// ---------- URL helpers ----------
function driveFolderId(url) {
  var m = /drive\.google\.com\/drive\/(?:u\/\d+\/)?folders\/([A-Za-z0-9_-]{10,})/i.exec(url || '');
  return m ? m[1] : '';
}
function driveFileId(url) {
  url = (url || '').trim();
  if (url.toLowerCase().indexOf('drive.google.com') === -1) return '';
  if (/\/drive\/(?:u\/\d+\/)?folders\//i.test(url)) return '';
  var m = /\/file\/(?:u\/\d+\/)?d\/([A-Za-z0-9_-]{10,})/.exec(url) || /[?&]id=([A-Za-z0-9_-]{10,})/.exec(url);
  return m ? m[1] : '';
}
function youtubeId(url) {
  var m = /(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/.exec(url || '');
  return m ? m[1] : '';
}
function localUrl(rel) {
  return String(rel).replace(/^\/+/, '').split('/').map(function (s) {
    try { return encodeURIComponent(decodeURIComponent(s)); } catch (e) { return encodeURIComponent(s); }
  }).join('/');
}
function imgSrc(url, size) {
  url = (url || '').trim();
  if (!url) return '';
  if (/^\/?uploads\//i.test(url)) return localUrl(url);
  if (url.indexOf('//') === 0) url = 'https:' + url;
  if (!/^https?:\/\//i.test(url)) return '';
  if (/drive\.google\.com/i.test(url)) {
    var id = driveFileId(url);
    return id ? 'https://drive.google.com/thumbnail?id=' + id + '&sz=w' + (size || 1200) : '';
  }
  return url;
}
function imgFallbacks(url) {
  var id = driveFileId(url);
  return id ? ['https://lh3.googleusercontent.com/d/' + id + '=w1200', 'https://drive.google.com/uc?export=view&id=' + id] : [];
}
function coverSrc(c) {
  c = (c || '').split(',')[0].trim();
  if (!c) return '';
  if (/^(https?:)?\/\//i.test(c)) return imgSrc(c);
  if (/^\/?uploads\//i.test(c)) return localUrl(c);
  return localUrl('uploads/dokumentasi/' + c.split('/').pop());
}
function directVideo(url) { return /\.(mp4|webm|ogg)(\?.*)?$/i.test(url || ''); }

// Sampul kartu: cover_url dulu, lalu cadangan sesuai jenis
function cardImage(it) {
  var cover = coverSrc(it.cover_url), src = '', fb = [];
  var yt = youtubeId(it.url);
  var alt = imgSrc(it.url);
  if (cover) {
    src = cover;
    fb = imgFallbacks(it.cover_url);
    if (yt) fb.push('https://i.ytimg.com/vi/' + yt + '/hqdefault.jpg');
    else if (it.tipe === 'foto' && alt && alt !== cover) fb.push(alt);
  } else if (yt) {
    src = 'https://i.ytimg.com/vi/' + yt + '/hqdefault.jpg';
  } else if (it.tipe !== 'video' && it.tipe !== 'folder') {
    src = alt; fb = imgFallbacks(it.url);
  } else if (it.tipe === 'video' && driveFileId(it.url)) {
    src = imgSrc(it.url); fb = imgFallbacks(it.url);
  }
  return { src: src, fb: fb };
}

// ---------- Data ----------
function normalize(o) {
  var tipe = (o.tipe || '').toLowerCase();
  if (tipe !== 'foto' && tipe !== 'video' && tipe !== 'folder') {
    tipe = driveFolderId(o.url) ? 'folder' : (youtubeId(o.url) || directVideo(o.url)) ? 'video' : 'foto';
  }
  var d = Date.parse(o.created_at);
  return {
    id: o.id, slug: o.slug, name: o.name || '(tanpa judul)', tipe: tipe, url: o.url,
    cover_url: o.cover_url, deskripsi: o.deskripsi, created_at: o.created_at,
    time: isNaN(d) ? 0 : d, key: o.slug || o.id
  };
}
function fmtDate(s) {
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || '');
  return m ? m[3] + '-' + m[2] + '-' + m[1] : (s || '');
}
function commentCount(it) { return (state.comments[it.id] || []).length; }

function visible() {
  var q = state.q.toLowerCase();
  return state.items.filter(function (it) {
    if (state.filter !== 'semua' && it.tipe !== state.filter) return false;
    if (!q) return true;
    return (it.name + ' ' + (it.deskripsi || '')).toLowerCase().indexOf(q) !== -1;
  });
}

// ---------- Render ----------
function renderFilters() {
  var counts = { semua: state.items.length, foto: 0, video: 0, folder: 0 };
  state.items.forEach(function (it) { counts[it.tipe]++; });
  var labels = [['semua', 'Semua'], ['foto', 'Foto'], ['video', 'Video'], ['folder', 'Folder']];
  $('filters').innerHTML = labels.map(function (l) {
    return '<button class="pill" data-f="' + l[0] + '" aria-pressed="' + (state.filter === l[0]) + '">' +
      l[1] + '<span class="n">' + counts[l[0]] + '</span></button>';
  }).join('');
}

function cardHTML(it) {
  var img = cardImage(it);
  var badge = it.tipe === 'folder' ? '<span class="badge">' + ICON.folder + 'Folder</span>'
            : it.tipe === 'video'  ? '<span class="badge">' + ICON.video + 'Video</span>' : '';
  var inner;
  if (img.src) {
    inner = '<img src="' + esc(img.src) + '" data-fallbacks="' + esc(img.fb.join('|')) + '" alt="' + esc(it.name) + '" loading="lazy" referrerpolicy="no-referrer">' +
            '<div class="empty" style="display:none">' + ICON.image + '<span>Gambar tidak dapat dimuat</span></div>';
  } else if (it.tipe === 'folder') {
    inner = '<div class="empty">' + ICON.folder + '<span>Folder Google Drive</span></div>';
  } else if (it.tipe === 'video') {
    inner = '<div class="empty">' + ICON.video + '<span>Video</span></div>';
  } else {
    inner = '<div class="empty">' + ICON.image + '<span>URL tidak valid</span></div>';
  }
  var play = it.tipe === 'video' ? '<div class="play"><span>' + ICON.video + '</span></div>' : '';
  return '<article class="card">' +
    '<button class="cover" data-key="' + esc(it.key) + '" aria-label="Buka ' + esc(it.name) + '">' + badge + inner + play +
    '<span class="count">' + ICON.comment + commentCount(it) + '</span></button>' +
    '<div class="body"><button class="title" data-key="' + esc(it.key) + '">' + esc(it.name) + '</button>' +
    '<div class="meta">' + esc(fmtDate(it.created_at)) + '</div></div></article>';
}

function render() {
  renderFilters();
  var list = visible();
  var pages = Math.max(1, Math.ceil(list.length / PER_PAGE));
  if (state.page > pages) state.page = pages;
  var slice = list.slice((state.page - 1) * PER_PAGE, state.page * PER_PAGE);

  if (!state.items.length) {
    $('content').innerHTML = $('driveSection').hidden ? '<div class="state">Belum ada dokumentasi.</div>' : '';
    $('filters').innerHTML = $('driveSection').hidden ? $('filters').innerHTML : '';
  } else if (!list.length) {
    $('content').innerHTML = '<div class="state">Tidak ada hasil yang cocok. Coba kata kunci atau filter lain.</div>';
  } else {
    $('content').innerHTML = '<div class="grid">' + slice.map(cardHTML).join('') + '</div>';
  }

  var p = '';
  if (pages > 1) {
    p += '<button data-p="' + (state.page - 1) + '"' + (state.page === 1 ? ' disabled' : '') + '>Sebelumnya</button>';
    for (var i = 1; i <= pages; i++) {
      if (i === 1 || i === pages || Math.abs(i - state.page) <= 2) {
        p += '<button data-p="' + i + '"' + (i === state.page ? ' aria-current="page"' : '') + '>' + i + '</button>';
      } else if (Math.abs(i - state.page) === 3) { p += '<span>…</span>'; }
    }
    p += '<button data-p="' + (state.page + 1) + '"' + (state.page === pages ? ' disabled' : '') + '>Berikutnya</button>';
  }
  $('pager').innerHTML = p;
}

// ---------- Modal ----------
function stageHTML(it) {
  var yt = youtubeId(it.url), fid = driveFileId(it.url), folder = driveFolderId(it.url);
  if (it.tipe === 'folder' && folder) {
    return '<div class="frame tall"><iframe src="https://drive.google.com/embeddedfolderview?id=' + folder + '#grid" title="' + esc(it.name) + '" loading="lazy"></iframe></div>';
  }
  if (it.tipe === 'video') {
    if (yt) return '<div class="frame"><iframe src="https://www.youtube-nocookie.com/embed/' + yt + '" title="' + esc(it.name) + '" allow="accelerometer; encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe></div>';
    if (fid) return '<div class="frame"><iframe src="https://drive.google.com/file/d/' + fid + '/preview" title="' + esc(it.name) + '" allow="autoplay; fullscreen" allowfullscreen loading="lazy"></iframe></div>';
    if (directVideo(it.url)) {
      var v = /^https?:\/\//i.test(it.url) ? it.url : localUrl(it.url);
      return '<div class="frame"><video src="' + esc(v) + '" controls preload="metadata"></video></div>';
    }
  }
  var src = imgSrc(it.url, 1600);
  if (src) {
    return '<img src="' + esc(src) + '" data-fallbacks="' + esc(imgFallbacks(it.url).join('|')) + '" alt="' + esc(it.name) + '" referrerpolicy="no-referrer">' +
           '<div class="none" style="display:none">Gambar tidak dapat dimuat.</div>';
  }
  var c = cardImage(it);
  if (c.src) return '<img src="' + esc(c.src) + '" data-fallbacks="' + esc(c.fb.join('|')) + '" alt="' + esc(it.name) + '" referrerpolicy="no-referrer"><div class="none" style="display:none">Gambar tidak dapat dimuat.</div>';
  return '<div class="none">Pratinjau tidak tersedia untuk URL ini.</div>';
}
function externalLink(it) {
  var u = (it.url || '').trim();
  if (/^https?:\/\//i.test(u)) return u;
  return '';
}
function openItem(key) {
  var it = state.items.filter(function (x) { return String(x.key) === String(key); })[0];
  if (!it) return;
  state.current = key;
  $('mTitle').textContent = it.name;
  $('mMeta').textContent = fmtDate(it.created_at);
  $('mStage').innerHTML = stageHTML(it);
  var cs = state.comments[it.id] || [];
  var ext = externalLink(it);
  var html = '';
  if (it.deskripsi) html += '<p class="desc">' + esc(it.deskripsi) + '</p>';
  if (ext) {
    var label = it.tipe === 'folder' ? 'Buka folder di Google Drive' : youtubeId(it.url) ? 'Buka di YouTube' : /drive\.google\.com/i.test(ext) ? 'Buka di Google Drive' : 'Buka sumber asli';
    html += '<div class="actions"><a class="btn" href="' + esc(ext) + '" target="_blank" rel="noopener noreferrer">' + label + '</a></div>';
  }
  html += '<h3>Komentar (' + cs.length + ')</h3>';
  html += cs.length ? cs.map(function (c) {
    return '<div class="cmt"><b>' + esc(c.nama || 'Anonim') + '</b><time>' + esc(fmtDate(c.created_at)) + '</time><p>' + esc(c.komentar) + '</p></div>';
  }).join('') : '<div class="none-cmt">Belum ada komentar.</div>';
  $('mBody').innerHTML = html;
  $('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
  $('mClose').focus();
  var h = '#' + encodeURIComponent(key);
  if (location.hash !== h) history.pushState(null, '', h);
}
function closeModal() {
  if (!$('modal').classList.contains('open')) return;
  $('modal').classList.remove('open');
  $('mStage').innerHTML = '';   // hentikan video
  document.body.style.overflow = '';
  state.current = null;
  if (location.hash) history.pushState(null, '', location.pathname + location.search);
}
function syncHash() {
  var key = decodeURIComponent(location.hash.slice(1) || '');
  if (key) { if (String(state.current) !== key) openItem(key); }
  else if ($('modal').classList.contains('open')) {
    $('modal').classList.remove('open'); $('mStage').innerHTML = ''; document.body.style.overflow = ''; state.current = null;
  }
}

// ---------- Events ----------
function imgFail(img) {
  var list = (img.dataset.fallbacks || '').split('|').filter(Boolean);
  var i = parseInt(img.dataset.fbi || '0', 10);
  if (i < list.length) { img.dataset.fbi = i + 1; img.src = list[i]; return; }
  img.style.display = 'none';
  if (img.nextElementSibling) img.nextElementSibling.style.display = 'flex';
}
document.addEventListener('error', function (e) {
  if (e.target && e.target.tagName === 'IMG' && e.target.dataset && 'fallbacks' in e.target.dataset) imgFail(e.target);
}, true);
document.addEventListener('load', function (e) {
  var t = e.target;
  if (t && t.tagName === 'IMG' && t.dataset && 'fallbacks' in t.dataset && t.naturalWidth <= 1) imgFail(t);
}, true);

$('content').addEventListener('click', function (e) {
  var b = e.target.closest('[data-key]');
  if (b) openItem(b.getAttribute('data-key'));
});
$('filters').addEventListener('click', function (e) {
  var b = e.target.closest('[data-f]');
  if (b) { state.filter = b.getAttribute('data-f'); state.page = 1; render(); }
});
$('pager').addEventListener('click', function (e) {
  var b = e.target.closest('[data-p]');
  if (b && !b.disabled) { state.page = parseInt(b.getAttribute('data-p'), 10); render(); window.scrollTo({ top: 0 }); }
});
$('searchForm').addEventListener('submit', function (e) { e.preventDefault(); state.q = $('q').value.trim(); state.page = 1; render(); });
$('q').addEventListener('input', function () { state.q = this.value.trim(); state.page = 1; render(); });
$('mClose').addEventListener('click', closeModal);
$('modal').addEventListener('click', function (e) { if (e.target === this) closeModal(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
window.addEventListener('hashchange', syncHash);
window.addEventListener('popstate', syncHash);

// ---------- Mulai ----------
if (DRIVE_FOLDER_ID) {
  $('driveLink').href = 'https://drive.google.com/drive/folders/' + DRIVE_FOLDER_ID;
  $('driveLink').hidden = false;
}
Promise.all([loadTab(TAB_DOK, PUB_DOK), loadTab(TAB_KOM, PUB_KOM).catch(function () { return []; }), loadDriveFiles()]).then(function (res) {
  var known = {};
  var rows = res[0].filter(function (o) { return o.name || o.url; });
  rows.forEach(function (o) { var f = driveFileId(o.url) || driveFolderId(o.url); if (f) known[f] = 1; });
  var auto = res[2].filter(function (o) { return !known[driveFileId(o.url) || driveFolderId(o.url)]; });
  state.items = rows.concat(auto).map(normalize)
    .sort(function (a, b) { return b.time - a.time || (parseInt(b.id, 10) || 0) - (parseInt(a.id, 10) || 0); });
  // Tanpa API key, foto/video di folder Drive ditampilkan langsung sebagai grid (tanpa perlu klik kartu folder)
  if (DRIVE_FOLDER_ID && !auto.length) {
    $('driveFrame').src = 'https://drive.google.com/embeddedfolderview?id=' + DRIVE_FOLDER_ID + '#grid';
    $('driveSection').hidden = false;
  }
  res[1].forEach(function (c) {
    if (!c.dokumentasi_id || !(c.komentar || '').trim()) return;
    (state.comments[c.dokumentasi_id] = state.comments[c.dokumentasi_id] || []).push(c);
  });
  render();
  syncHash();
}).catch(function (err) {
  $('filters').innerHTML = '';
  $('content').innerHTML = '<div class="state error"><b>Data galeri tidak dapat dimuat.</b> (' + esc(err.message) + ')<ul>' +
    '<li>Pastikan Google Sheets dibagikan dengan akses <i>Anyone with the link: Viewer</i>.</li>' +
    '<li>Pastikan nama tab persis <code>' + esc(TAB_DOK) + '</code> dan <code>' + esc(TAB_KOM) + '</code>.</li>' +
    '<li>Jangan buka file langsung dari komputer (alamat <code>file://</code>); buka lewat GitHub Pages atau server lokal.</li>' +
    '<li>Jika masih gagal: File &gt; Share &gt; Publish to web &gt; pilih tab &gt; format CSV, lalu tempel linknya ke <code>PUB_DOK</code> / <code>PUB_KOM</code>.</li>' +
    '<li>Cek koneksi internet, lalu muat ulang halaman.</li></ul></div>';
});
</script>
</body>
</html>
